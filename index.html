<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Code क्षेत्र — Real-Time 1v1 Coding Duel Arena</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />

    <!-- Apple iOS PWA Custom Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Code क्षेत्र" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Code क्षेत्र — Real-Time 1v1 Coding Duel Arena" />
    <meta property="og:description" content="Challenge rival coders in live speed duels. Execute code in real-time, solve LeetCode algorithms, and climb the global ELO ladder on Code क्षेत्र!" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Google Fonts (Latin, Devanagari & Premium Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 selection:bg-cyan-500/30 selection:text-cyan-200 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- PWA Service Worker Registration & Cache Purge Script -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA Service Worker] Registered:', reg.scope);
              reg.update();
            })
            .catch(err => console.warn('[PWA Service Worker] Registration failed:', err));
        });
      }
      if ('caches' in window) {
        caches.keys().then(keys => {
          keys.forEach(k => {
            if (k !== 'code-kshetra-v5') caches.delete(k);
          });
        });
      }
    </script>
  </body>
</html>
