<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem -->
  <g transform="translate(10, 10)">
    <polygon points="40,4 72,20 72,60 40,76 8,60 8,20" fill="#0f172a" stroke="url(#iconGrad)" stroke-width="3" />
    <path d="M 26,30 L 18,40 L 26,50" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 54,30 L 62,40 L 54,50" fill="none" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="45" y1="27" x2="35" y2="53" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Typography: "Code क्षेत्र" -->
  <text x="105" y="58" font-family="'Inter', 'Rajdhani', sans-serif" font-weight="900" font-size="36" fill="url(#neonTextGrad)" letter-spacing="1">CODE</text>
  <text x="215" y="58" font-family="'Noto Sans Devanagari', 'Hind', sans-serif" font-weight="800" font-size="38" fill="#f8fafc" letter-spacing="0">क्षेत्र</text>
  
  <text x="106" y="78" font-family="'Fira Code', monospace" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="2">REAL-TIME 1v1 DUEL ARENA</text>
