<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Outer Hexagon Arena Shield -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="4" />

  <!-- Code Brackets < > & Crossed Swords Emblem -->
  <path d="M 32,38 L 22,50 L 32,62" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68,38 L 78,50 L 68,62" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="56" y1="35" x2="44" y2="65" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Central Glow Accent -->
  <circle cx="50" cy="50" r="4" fill="#06b6d4" />
</svg>